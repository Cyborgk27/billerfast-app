<h2 mat-dialog-title>Mi cuenta</h2>

<mat-dialog-content>
  @if (uploading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  @if (user(); as user) {
    <div class="profile">
      <img class="avatar" [src]="previewUrl() ?? avatarUrl()" alt="Foto de perfil" />
      <div class="info">
        <span class="name">{{ user.apodo }}</span>
        <span class="email">{{ user.correo }}</span>
      </div>
    </div>

    <p class="hint">Elige una foto para tu perfil (se verá junto a tu nombre).</p>

    <input
      #fileInput
      type="file"
      accept=".png,.jpg,.jpeg,.webp,.gif,.svg"
      (change)="onFileSelected($event)"
      hidden
    />
    <div class="actions">
      <button mat-stroked-button (click)="fileInput.click()">
        <i class="pi pi-image"></i>
        {{ selectedImage() ? 'Cambiar foto' : 'Elegir foto' }}
      </button>
      <button
        mat-raised-button
        (click)="save()"
        [disabled]="!selectedImage() || uploading()"
      >
        Guardar foto
      </button>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cerrar</button>
</mat-dialog-actions>
