<div class="auth-container">
  <mat-card class="auth-card">
    <div class="auth-hero">
      <div class="brand-logo"><i class="pi pi-fire"></i></div>
      <span class="brand">BillerFast</span>
      <span class="brand-sub">Inicia sesión en tu panel</span>
    </div>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <mat-form-field appearance="outline">
          <mat-label>Usuario o correo</mat-label>
          <input matInput formControlName="identificador" placeholder="Tu nombre de usuario o correo" autocomplete="username" />
          @if (form.controls['identificador'].hasError('required')) {
            <mat-error>Obligatorio</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="contrasena" type="password" autocomplete="current-password" />
          @if (form.controls['contrasena'].hasError('required')) {
            <mat-error>Obligatorio</mat-error>
          }
        </mat-form-field>

        <button mat-raised-button type="submit" [disabled]="form.invalid || loading()" class="submit-btn">
          Entrar
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <span class="hint">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></span>
    </mat-card-actions>
  </mat-card>
</div>
